 <div class="grid"><section class="card"><span class="stat-label">Overdue · ${data.overdue.length} invoices</span><span class="amount large">${usd(data.totals.overdue)}</span></section><section class="card"><span class="stat-label">Never billed · ${data.unbilled.length} jobs</span><span class="amount large">${usd(data.totals.unbilled)}</span></section><section class="card"><span class="stat-label">Requests not on board</span><span class="amount large">${data.totals.missing} / ${data.totals.requests}</span></section></div>
 <section class="card"><h2>Then stop requests slipping through</h2><p class="small">${data.requests.filter(r=>r.status==='missing').length} requests name a client and video but have no matching note. ${data.requests.filter(r=>!r.onBoard&&r.status==='review').length} more need a client or video clarified. Not recorded does not mean not fixed.</p>${btn('tab','Review requests','Requests',true)}</section>${data.review.length?`<div class="notice">${data.review.length} contact${data.review.length===1?'':'s'} need identity review. ${btn('tab','Review contacts','Clients',true)}</div>`:''}`;}
 function invoiceEvidence(i){return `<div class="evidence">${esc(i.id)} · issued ${esc(i.issuedDay)} · due ${esc(i.dueDay)}<br>Tool: ${esc(i.status)} · billed ${usd(i.amount)} · balance ${usd(Math.max(0,i.remaining))}${i.booking?'<br>Matched booking: '+esc(i.booking):''}${i.duplicate?'<br><b>Inferred duplicate: cancelled B147 was moved to B152; original invoice INV-1130 was paid.</b>':''}${i.discountCorrection?'<br>May studio discount makes the agreed charge $255.':''}${i.client?.includes('Marcus Moore')?'<br><b>Inferred: P5128 is allocated to the older INV-1100. Verify before acting.</b>':''}${i.allocations.length?'<br>'+i.allocations.map(a=>`${esc(a.payment)}: ${usd(a.amount)} · ${esc(a.why)}${a.inferred?' (inferred)':''}`).join('<br>'):'<br>No matching bank payment found.'}</div>`;}
 function money(){return `<h1>Money, reconciled</h1><p class="section-intro">Bank payments and bookings determine balances. Billing-tool status is shown as evidence.</p><section class="card"><div class="row"><h2>Overdue</h2><b class="amount">${usd(data.totals.overdue)}</b></div>${data.overdue.map(i=>`<details><summary>${esc(i.client==='@payer'?'Brightline payer':i.client||i.bill_to)} <span class="amount">${usd(i.remaining)} · ${i.late}d</span></summary><p>${clientLink(i.client)}</p>${invoiceEvidence(i)}${i.client==='Luna Chiropractic'?'<p class="small warn">Call about the contract before sending a payment reminder.</p>':''}${action('od:'+i.id,`Hi ${i.client||i.bill_to}, invoice ${i.id} has ${usd(i.remaining)} outstanding and is ${i.late} days past due. Could you confirm the payment status? Thank you.`,'Approve: draft reminder')}</details>`).join('')||'<p class="empty">No overdue invoices.</p>'}</section>
 <section class="card"><div class="row"><h2>Completed, never billed</h2><b class="amount">${usd(data.totals.unbilled)}</b></div>${data.unbilled.map(b=>`<details><summary>${esc(b.client||b.client_name)}<span class="amount">${usd(b.amount)}</span></summary><p class="small">${esc(b.id)} · ${esc(b.day)} · ${esc(b.service)} · completed. No invoice matched by booking reference or client, amount and date.</p>${clientLink(b.client)}${action('bill:'+b.id,`Review and create an invoice for ${b.client||b.client_name}, booking ${b.id}, ${b.service} on ${b.day}, ${usd(b.amount)}.`,'Approve: draft billing task')}</details>`).join('')||'<p class="empty">Every completed job has a matching invoice.</p>'}</section>
 <section class="card"><div class="row"><h2>Refunds or credits to review</h2><b class="amount">${usd(data.totals.credits)}</b></div>${data.credits.map(c=>`<details><summary>${esc(c.client)}<span class="amount">${usd(c.amount)}</span></summary><p class="small">${esc(c.invoice)} · ${esc(c.why)}</p>${action('credit:'+c.invoice,`Review ${usd(c.amount)} refund or credit for ${c.client}, invoice ${c.invoice}. ${c.why}`,'Approve: draft refund review')}</details>`).join('')||'<p class="empty">No invoice overpayments found.</p>'}</section>
 <section class="card"><h2>${data.discrepancies.length} billing-tool differences</h2>${data.discrepancies.map(d=>`<details><summary>${esc(d.invoice)}: tool says ${esc(d.tool)}; ${esc(d.truth)}</summary>${invoiceEvidence(data.invoices.find(i=>i.id===d.invoice))}</details>`).join('')}</section>${data.issues.length?`<section class="card"><h2>Payment matching needs attention</h2>${data.issues.map(i=>`<p class="small">${esc(i.id)} · ${esc(i.message)}</p>`).join('')}</section>`:''}`;}
 function requestList(){const list=data.requests.filter(r=>filter==='all'||filter==='logged'?filter==='all'||r.onBoard:!r.onBoard);const periods=[['Apr–Jun','2026-04-01','2026-06-30'],['Jul–Oct','2026-07-01','2026-10-31']].map(([label,a,b])=>{const rs=data.requests.filter(r=>r.date>=a&&r.date<=b);return `${label}: ${rs.filter(r=>!r.onBoard).length} / ${rs.length}`;});return `<h1>Requests need an owner</h1><p class="section-intro">${data.totals.missing} of ${data.totals.requests} edit requests have no matching board note. ${esc(periods.join(' · '))}. A board note can satisfy only one request.</p><div class="toolbar">${btn('filter','Not on board','missing',filter!=='missing')}${btn('filter','On board','logged',filter!=='logged')}${btn('filter','All requests','all',filter!=='all')}</div><section class="card">${list.map(r=>`<details><summary>${esc(r.client||'Unknown contact')} · ${esc(r.title)} <span class="pill ${r.onBoard?'':'warn'}">${r.onBoard?'On board':r.status==='review'?'Needs review':'Not on board'}</span></summary><p class="small">${esc(r.date)} ${esc(r.time)} · ${esc(r.channel)} · ${esc(r.sender)}</p><p class="evidence">${esc(r.text)}</p>${r.video?`<p class="small">${esc(r.video.id)} · ${esc(r.video.title)} · ${esc(r.video.editor)}<br>${esc(r.videoConfidence)}${r.onBoard?'<br>Board note: '+esc(r.video.notes_on_board):''}</p>`:'<p class="small warn">The video is not identified reliably. Clarify it with the client.</p>'}${clientLink(r.client)}${!r.onBoard?action('request:'+r.id,`Log and review this request: ${r.client||r.sender}, ${r.date}, ${r.type}. Client said: ${r.text}. ${r.video?'Possible video '+r.video.id+' (verify match).':'Ask which video.'}`,'Approve: draft board entry'):''}</details>`).join('')||'<p class="empty">No requests in this view.</p>'}</section>`;}
 function leads(){return `<h1>Follow up, then learn</h1><section class="card"><h2>${data.noReply.length} leads without a reply</h2>${data.noReply.map(l=>`<details><summary>${esc(l.business||l.name)} <span class="pill">${esc(l.id)}</span></summary><p class="small">${esc(l.created)} · ${esc(l.source)} · ${esc(l.email)} · ${esc(l.phone)}</p>${l.client?clientLink(l.client):''}${action('lead:'+l.id,`Hi ${l.name}, thank you for reaching out to Axeom about ${l.business||'our services'}. Could we arrange a quick call to understand what you need?`,'Approve: draft reply')}</details>`).join('')}</section><section class="card"><h2>Channel results</h2><p class="small">Current cash-based delivery-profit leader: <b>${esc(data.channels[0]?.name||'not enough data')}</b>. Conversion is shown separately. Ad spend, rent, tax and owner time are unavailable.</p><div class="table-wrap"><table><thead><tr><th>Channel</th><th>Won / leads</th><th>Cash less delivery cost</th><th>Billed less delivery cost</th></tr></thead><tbody>${data.channels.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.won} / ${c.leads}</td><td>${usd(c.cashProfit)}</td><td>${usd(c.billedProfit)}</td></tr>`).join('')}</tbody></table></div><p class="small">Studio hours come from the service type and costs.csv; editor hours and rates come from the board and team.csv. Inferred payment/booking matches affect these figures.</p></section>`;}
 function reviewQueue(){return data.review.length?`<section class="card"><h2>Review ${data.review.length} unknown contact${data.review.length===1?'':'s'}</h2><p class="small">Choose an existing client or create a separate client. Similar names are never merged automatically.</p>${data.review.map((r,i)=>`<div class="review-item"><p class="break"><b>${esc(r.label)}</b><br><span class="small">${esc(r.key)} · ${esc(r.context)}</span></p><select id="match-${i}" aria-label="Match ${attr(r.label)}"><option value="">Choose a client</option>${data.directory.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select>${btn('match','Confirm match',String(i))}<input id="new-${i}" value="${attr(r.label)}" aria-label="New client name">${btn('new-client','Keep as new client',String(i),true)}</div>`).join('')}</section>`:'';}
 function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}
 function clients(){if(current)return detail();const query=search.toLowerCase(),list=data.directory.filter(c=>[c.name,...c.aliases,...c.emails,...c.phones].join(' ').toLowerCase().includes(query));return `<h1>One place for each client</h1><p class="section-intro">${data.directory.length} clients. Brightline is a payer for Sunset and Silverleaf; it is not a separate client.</p><input type="search" id="search" placeholder="Search name, email or phone" aria-label="Search clients" value="${attr(search)}"><div class="small search-count">${list.length} matching clients</div><section class="card">${list.map(c=>{const inv=data.invoices.filter(i=>i.client===c.name),bookings=data.bookings.filter(b=>b.client===c.name);return `<div class="client-item"><button class="client-button" data-action="client" data-value="${attr(c.name)}"><b>${esc(c.name)}</b><br><span class="small">${inv.length} invoices · ${bookings.length} bookings · ${data.videos.filter(v=>v.client===c.name).length} videos</span></button></div>`;}).join('')||'<p class="empty">No client matches that search.</p>'}</section>${reviewQueue()}`;}
 function detail(){const c=data.directory.find(c=>c.name===current);if(!c){current='';return clients();}const inv=data.invoices.filter(i=>i.client===c.name),pay=data.payments.filter(p=>p.client===c.name||p.endClients?.includes(c.name)),bk=data.bookings.filter(b=>b.client===c.name),vid=data.videos.filter(v=>v.client===c.name),msg=data.messages.filter(m=>m.client===c.name),ls=data.leads.filter(l=>l.client===c.name);return `${btn('back','Back to all clients','',true)}<h1>${esc(c.name)}</h1><section class="card">${/Sunset|Silverleaf/.test(c.name)?'<p class="pill">Brightline Marketing pays on this client’s behalf</p>':''}<p class="small">Also seen as: ${esc(c.aliases.join('; ')||'—')}</p><p class="small break">${esc(c.emails.join(' · '))}<br>${esc(c.phones.join(' · '))}</p></section><section class="card"><h2>Invoices (${inv.length})</h2>${inv.map(i=>`<details><summary>${esc(i.id)}<span class="amount">${usd(i.amount)} · ${i.duplicate?'duplicate?':i.remaining>0?'open':i.remaining<0?'credit':'paid'}</span></summary>${invoiceEvidence(i)}<p class="source">${source('inv',i.id)}</p></details>`).join('')||'<p class="empty">None.</p>'}</section><section class="card"><h2>Payments (${pay.length})</h2>${table(['ID / date','Paid','Allocated to invoices'],pay.map(p=>`<tr><td>${esc(p.id)}<br>${esc(p.day)}</td><td>${usd(p.amount)}</td><td>${p.allocations.map(a=>`${esc(a.invoice)}: ${usd(a.amount)}${a.inferred?' (inferred)':''}`).join('<br>')||'Unallocated'}</td></tr>`))}</section><section class="card"><h2>Bookings (${bk.length})</h2>${table(['ID / date','Service','Price / status'],bk.map(b=>`<tr><td>${esc(b.id)}<br>${esc(b.day)}</td><td>${esc(b.service)}</td><td>${usd(b.amount)}<br>${esc(b.status)}</td></tr>`))}</section><section class="card"><h2>Videos (${vid.length})</h2>${vid.map(v=>`<details><summary>${esc(v.id)} · ${esc(v.title)}</summary><p class="small">${esc(v.editor)} · ${esc(v.stage)} · ${esc(v.editor_hours)} editor hours<br>Shoot ${esc(v.shoot_booking)} · ${esc(v.shootDay)}<br>Board note: ${esc(v.notes_on_board||'none')}</p></details>`).join('')}</section><section class="card"><h2>Messages (${msg.length})</h2>${msg.map(m=>`<details><summary>${esc(m.date)} · ${esc(m.channel)} · ${m.direction==='from'?'Received':'Sent'}</summary><p class="small break">${esc(m.sender)}</p><p class="evidence">${esc(m.text)}</p></details>`).join('')}</section><section class="card"><h2>Leads (${ls.length})</h2>${table(['ID / date','Source','Reply / status'],ls.map(l=>`<tr><td>${esc(l.id)}<br>${esc(l.created)}</td><td>${esc(l.source)}</td><td>${esc(l.first_reply||'No reply')}<br>${esc(l.status)}</td></tr>`))}</section>`;}
 function files(){return `<h1>Add new files</h1><p class="section-intro">Upload CSV, messages.txt or a ZIP. Preview additions, changed records and errors before confirming. Updated records replace the same ID; duplicates are skipped.</p><section class="card">${btn('pick','Add new files')}${pending.length?`<h2>Check before importing</h2>${pending.map(p=>p.error?`<p class="small warn">${esc(p.name)}: ${esc(p.error)}</p>`:`<div class="notice"><b>${esc(p.name)}</b><p class="small">${p.add.length} new · ${p.updates.length} updated · ${p.duplicates} unchanged · ${p.errors.length} invalid</p>${p.updates.length?`<details><summary>Review changed fields</summary>${p.updates.map(u=>`<p class="small">${esc(u.after[E.keys[p.kind]])}: ${E.required[p.kind].filter(k=>u.before[k]!==u.after[k]).map(k=>`${esc(k)}: ${esc(u.before[k])} → ${esc(u.after[k])}`).join('; ')}</p>`).join('')}</details>`:''}${p.errors.map(e=>`<p class="small warn">${esc(e)}</p>`).join('')}</div>`).join('')}${btn('import','Import valid records')}${btn('cancel','Cancel','',true)}`:''}<p class="small">Payments use DD/MM/YYYY; bookings use MM/DD/YYYY; invoices use YYYY-MM-DD. All totals use the selected analysis date.</p></section><section class="card"><h2>Data on this device</h2><p class="small">${data.raw.inv.length} invoices · ${data.raw.pay.length} payments · ${data.raw.bk.length} bookings · ${data.raw.msg.length} messages · ${data.raw.board.length} videos · ${data.raw.lead.length} leads</p><p class="small">Every view recalculates from these records, including team rates and costs. Imports and review choices are stored only in this browser.</p><label class="small">Analyze as of <input id="analysis-date" type="date" value="${attr(state.asof)}"></label><p>${btn('backup','Download device backup','',true)}${btn('reset','Reset this device','',true)}</p></section><footer>Only suggestions are produced. No message, invoice or refund is sent or changed in another system.</footer>`;}
 const views={Today:today,Money:money,Requests:requestList,Leads:leads,Clients:clients,Files:files};
 function render(recalculate=true){if(recalculate)data=E.analyze(seed,state);drafts.clear();$('#asof').textContent='As of '+state.asof;$('#main').innerHTML=(notice?`<div role="status" class="notice">${esc(notice)}</div>`:'')+(storageError?`<div role="alert" class="notice danger">${esc(storageError)}</div>`:'')+views[tab]();$('#nav').innerHTML=tabs.map(t=>`<button data-action="tab" data-value="${t}" class="${tab===t?'active':''}"${tab===t?' aria-current="page"':''}>${t}</button>`).join('');}
 async function pick(files){pending=[];notice='';const list=[];let bytes=0;for(const file of files){if(file.size>20*1024*1024){pending.push({name:file.name,error:'File exceeds 20 MB'});continue;}if(/\.zip$/i.test(file.name)){try{const zip=await JSZip.loadAsync(file);for(const [name,entry]of Object.entries(zip.files)){if(entry.dir)continue;if(!/\.(csv|txt)$/i.test(name)){pending.push({name,error:'Unsupported ZIP entry; only CSV and TXT are imported'});continue;}const text=await entry.async('string');bytes+=text.length;if(bytes>50*1024*1024)throw Error('ZIP contents exceed 50 MB');list.push({name:name.split('/').pop(),text});}}catch(e){pending.push({name:file.name,error:'Could not read ZIP: '+e.message});}}else list.push({name:file.name,text:await file.text()});}const simulated=JSON.parse(JSON.stringify(state));for(const f of list){try{const p=E.preview(seed,simulated,f.name,f.text);pending.push(p);E.apply(simulated,[p]);}catch(e){pending.push({name:f.name,error:e.message});}}tab='Files';render(false);}
 document.addEventListener('click',async event=>{const el=event.target.closest('button[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;notice='';if(a==='tab'){tab=v;current='';window.scrollTo(0,0);render(false);return;}if(a==='client'){current=v;tab='Clients';window.scrollTo(0,0);render(false);return;}if(a==='back'){current='';render(false);return;}if(a==='pick'){$('#files').click();return;}if(a==='cancel'){pending=[];render(false);return;}if(a==='filter'){filter=v;render(false);return;}if(['approve','skip','reviewed'].includes(a)){state.done[v]=a==='approve'?'approved':a;save();render(false);return;}if(a==='undo'){delete state.done[v];save();render(false);return;}if(a==='copy'){try{await navigator.clipboard.writeText(drafts.get(v)||'');notice='Draft copied. Nothing was sent.';}catch(e){notice='Select the draft text and copy it manually.';}render(false);return;}if(a==='match'||a==='new-client'){const r=data.review[Number(v)];if(!r)return;let name;if(a==='match'){name=$('#match-'+v).value;if(!name){notice='Choose a client before confirming.';render(false);return;}}else{name=$('#new-'+v).value.trim();if(!name){notice='Enter a name for the new client.';render(false);return;}if(!data.directory.some(c=>c.name===name))state.newClients.push({name,aliases:[],emails:r.key.includes('@')&&!r.key.startsWith('@')?[r.key]:[],phones:/\d{3}-\d{3}-\d{4}/.test(r.key)?[r.key]:[],new:true});}state.aliases[r.key]=name;save();render();return;}if(a==='import'){const result=E.apply(state,pending);pending=[];notice=`Imported ${result.added} new records and ${result.updated} updates. Unchanged and invalid records were skipped.`;save();render();return;}if(a==='reset'){if(confirm('Remove all imports, contact decisions and reviewed actions from this device?')){state=E.empty();pending=[];save();render();}return;}if(a==='backup'){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='axeom-device-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
 document.addEventListener('input',event=>{if(event.target.id==='search'){search=event.target.value;const start=event.target.selectionStart;render(false);$('#search').focus();$('#search').setSelectionRange(start,start);}});
 document.addEventListener('change',event=>{if(event.target.id==='analysis-date'){const d=E.date(event.target.value);if(d){state.asof=d;save();render();}}});
 $('#files').addEventListener('change',event=>{const files=[...event.target.files];pick(files).catch(e=>{notice='Import preview failed: '+e.message;render(false);});event.target.value='';});
 window.axeom={get state(){return state;},get data(){return data;},engine:E,pick};render();
})();
</script></body></html>
